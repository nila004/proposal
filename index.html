<!DOCTYPE html>
<html>
<head>
<title>Restricted Access</title>
<style>

body{
margin:0;
background:black;
color:#00ff88;
font-family:Courier New, monospace;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
/* MATRIX CANVAS */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* GLASS TERMINAL */
#terminalContainer{
background:rgba(0,0,0,0.75);
padding:30px;
border:1px solid #00ff88;
box-shadow:0 0 20px #00ff88;
width:80%;
max-width:700px;
backdrop-filter:blur(6px);
position:relative;
z-index:10;
}

.hidden{
display:none;
}

button{
background:transparent;
border:1px solid #00ff88;
color:#00ff88;
padding:10px 20px;
margin:15px 10px 0 0;
cursor:pointer;
font-family:Courier New, monospace;
transition:0.3s;
}

button:hover{
background:#00ff88;
color:black;
box-shadow:0 0 15px #00ff88;
}

#declineBtn{
position:relative;
}

input{
background:black;
border:1px solid #00ff88;
color:#00ff88;
padding:8px;
font-family:Courier New, monospace;
margin-top:10px;
width:200px;
}

/* FINAL SCREEN */
#finalScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);  /* transparent black */
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
transition:1.5s;
z-index:20;
}

#finalScreen img{
height:450px;
width:auto;
border:2px solid #00ff88;
box-shadow:0 0 35px #00ff88;
margin-bottom:25px;
object-fit:cover;
border-radius:8px;
opacity:0;
transform:scale(0.9);
transition:1.2s;
}

#finalText{
font-size:20px;
text-align:center;
white-space:pre-line;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="terminalContainer">
<div id="terminal"></div>

<div id="passwordSection" class="hidden">
<br>
Enter Password:
<br>
<input type="password" id="passwordInput">
<button onclick="checkPassword()">Unlock</button>
</div>

<div id="questionSection" class="hidden">
<div id="questionText"></div>
<button onclick="nextQuestion()">Yes</button>
</div>

<div id="proposalSection" class="hidden">
<div>
After analyzing 10 months of encrypted chats...
<br><br>
Will you be mine?
</div>
<button onclick="finalAccept()">ACCEPT</button>
<button id="declineBtn" onmouseover="moveButton()">DECLINE</button>
</div>
</div>

<div id="finalScreen">
<img src="pranav.jpeg">
<div id="finalText">
Access Granted.

You just unlocked something permanent.
This is the first photo that i took with you...and I LOVE YOU So much..


</div>
</div>

<script>

/* MATRIX BACKGROUND */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 14;
const columns = canvas.width/fontSize;
const drops = [];

for(let x=0; x<columns; x++)
drops[x]=1;

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#00ff88";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
const text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);
if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;
drops[i]++;
}
}

setInterval(draw,33);

/* TERMINAL TEXT */
const terminalText = [
"Initializing private server...",
"Decrypting last 10 months...",
"Long distance detected.",
"Emotional bandwidth stable.",
"",
"Hidden file: feelings.exe",
"",
"Password required."
];

let i=0;
function typeTerminal(){
if(i < terminalText.length){
document.getElementById("terminal").innerHTML += terminalText[i] + "<br>";
i++;
setTimeout(typeTerminal,600);
}else{
document.getElementById("passwordSection").classList.remove("hidden");
}
}
typeTerminal();

function checkPassword(){
const pass=document.getElementById("passwordInput").value;
// accept "nilapranav" (case-insensitive) as the correct password
if(pass.toLowerCase()=="nilapranav"){
document.getElementById("passwordSection").classList.add("hidden");
document.getElementById("terminal").innerHTML="";
document.getElementById("questionSection").classList.remove("hidden");
showQuestion();
}else{
alert("Access Denied.");
}
}

const questions=[
"Are you really comfortable with me?",
"When I text you... do you smile?",
"If I stay forever... will you be okay with that?",
"Can we be partners in everything?",
"Because I want that.",
"And I promise... I will always choose you."
];

let qIndex=0;

function showQuestion(){
document.getElementById("questionText").innerHTML=questions[qIndex];
}

function nextQuestion(){
qIndex++;
if(qIndex < questions.length){
showQuestion();
}else{
document.getElementById("questionSection").classList.add("hidden");
document.getElementById("proposalSection").classList.remove("hidden");
}
}

function moveButton(){
const btn=document.getElementById("declineBtn");
const x=Math.random()*400-200;
const y=Math.random()*200-100;
btn.style.transform=`translate(${x}px,${y}px)`;
}

function finalAccept(){
document.getElementById("terminalContainer").style.display="none";
const final=document.getElementById("finalScreen");
final.style.opacity="1";

setTimeout(()=>{
const img = document.querySelector("#finalScreen img");
img.style.opacity="1";
img.style.transform="scale(1)";
},500);
}

</script>

</body>
</html>
